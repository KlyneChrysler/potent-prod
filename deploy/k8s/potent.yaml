# Minimal potent deployment for Kubernetes.
#
# Apply with: kubectl apply -f deploy/k8s/potent.yaml
#
# Assumptions:
# - Your tool server is reachable at http://tools.default.svc.cluster.local:8000
# - You'll edit the upstream URL + image tag before shipping
# - Audit log writes to an emptyDir; mount a PVC for durability

apiVersion: v1
kind: ConfigMap
metadata:
  name: potent-policy
  labels: { app: potent }
data:
  policy.yaml: |
    defaults:
      mode: log_only
      ttl: 1h
    tools:
      send_email:
        mode: strict
        ttl: 24h
        normalize:
          to: [lowercase, trim]
          subject: [trim, collapse_whitespace]
        fingerprint_fields: [to, subject, body]
        semantic_threshold: 0.9
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: potent
  labels: { app: potent }
spec:
  replicas: 1
  selector:
    matchLabels: { app: potent }
  template:
    metadata:
      labels: { app: potent }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: potent
          # Pin to a versioned tag in dev; for production prefer an
          # immutable digest: image: ghcr.io/klynechrysler/potent@sha256:...
          # Rotate via GitOps PRs that change the digest, never :latest.
          image: ghcr.io/klynechrysler/potent:v0.1.0
          imagePullPolicy: IfNotPresent
          # POTENT_ADMIN_TOKEN gates every admin endpoint; the deployment
          # refuses to start if -admin-addr is set without it.
          env:
            - name: POTENT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: potent-admin
                  key: token
          args:
            - -mode=http
            - -addr=:8080
            - -metrics-addr=:9090
            - -admin-addr=127.0.0.1:9095  # loopback only; expose via NetworkPolicy + ingress with auth
            - -upstream=http://tools.default.svc.cluster.local:8000
            - -policy=/configs/policy.yaml
            - -store=bolt
            - -db=/data/potent.db
            - -audit-log=/data/audit.log
          ports:
            - { name: proxy,   containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
            # admin is bound to 127.0.0.1 inside the pod — intentionally
            # not declared as a containerPort to discourage Service exposure.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: proxy }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: proxy }
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - { name: policy, mountPath: /configs }
            - { name: data,   mountPath: /data }
      volumes:
        - name: policy
          configMap: { name: potent-policy }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: potent
  labels: { app: potent }
spec:
  selector: { app: potent }
  ports:
    - { name: proxy,   port: 8080, targetPort: proxy }
    - { name: metrics, port: 9090, targetPort: metrics }
---
# Admin token secret. Populate via `kubectl create secret generic potent-admin
# --from-literal=token=$(openssl rand -hex 32)`. Rotate on suspected exposure.
apiVersion: v1
kind: Secret
metadata:
  name: potent-admin
  labels: { app: potent, role: admin }
type: Opaque
stringData:
  token: "REPLACE-ME-WITH-AT-LEAST-32-RANDOM-CHARS"
---
# The admin port (9095) is loopback only inside the pod. To reach it from
# operator tooling, use `kubectl port-forward` or front it with an
# authenticated ingress + NetworkPolicy. Intentionally no Service.
